# ─────────────────────────────────────────────────────────────────────────────
# Vista Store — social preview dataset
#
# DEMONSTRATION CONTENT. Not owner data, not a real catalog, not a price list.
#
# It exists so the storefront can be looked at with plausible content before the
# owner has supplied anything. Every row it creates is owned by the import batch
# `vista-social-preview` and can be removed again with one command:
#
#   cd backend
#   .venv\Scripts\python.exe -m scripts.preview_cli purge --confirm
#
# ── WHAT IS AND IS NOT REAL ──────────────────────────────────────────────────
# Confirmed from https://www.instagram.com/vistastore.ps (reviewed 2026-08-02):
#   the line of business, the seven product lines below, and the brand's own
#   yellow/purple colour pairing. See docs/client/social-source-audit.md.
#
# NOT confirmed, and therefore invented as preview filler:
#   EVERY product name, EVERY price, EVERY stock number, EVERY description.
#   No price shown anywhere in this file came from Vista Store. Not one.
#
# Never inferred at all, and absent here on purpose: phone number, address,
# delivery areas and fees, currency, tax and legal details, warranty, policies.
# The single delivery area below is labelled as preview and priced at zero
# precisely so it cannot be mistaken for a real delivery rate.
# ─────────────────────────────────────────────────────────────────────────────

preview_schema_version: 1

batch_key: "vista-social-preview"
source_label: "Vista Store — Instagram-inspired preview catalog (2026-08-02)"

# Every media object this batch uploads goes under this prefix, and the purge
# refuses to delete anything outside it.
media_prefix: "vista-store/preview/"

notice: "نسخة تجريبية — البيانات والأسعار للمعاينة"

# ── media ────────────────────────────────────────────────────────────────────
# Generated locally by the project's own placeholder generator, then uploaded
# through the configured storage provider. No image was taken from a social CDN:
# those URLs are short-lived, and bulk-collecting a client's feed was out of
# scope. The yellow/purple pairing is the one visible in the Instagram bio.
media:
  - key: "hero-invitations"
    alt_text: "خلفية تدرّج لقسم مكاتيب الأفراح"
    shape: "wide"
    start_color: "#5B3E85"
    end_color: "#E4B33C"
  - key: "hero-gifts"
    alt_text: "خلفية تدرّج لقسم الهدايا المخصصة"
    shape: "wide"
    start_color: "#7A4FA3"
    end_color: "#F2D06B"
  - key: "hero-events"
    alt_text: "خلفية تدرّج لقسم مطبوعات المناسبات"
    shape: "wide"
    start_color: "#3F2A63"
    end_color: "#C98F2E"
  - key: "tile-wedding"
    alt_text: "صورة قسم مكاتيب وبطاقات الأفراح"
    start_color: "#6B4E9B"
    end_color: "#EBD9A8"
  - key: "tile-events"
    alt_text: "صورة قسم مطبوعات المناسبات والتخرج"
    start_color: "#4A3579"
    end_color: "#E4B33C"
  - key: "tile-gifts"
    alt_text: "صورة قسم الهدايا المخصصة"
    start_color: "#8A5FB0"
    end_color: "#F6E3A1"
  - key: "tile-apparel"
